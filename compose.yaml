name: docker-lab
services:
  api:
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    build: .
    image: docker-lab-api:local
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      DB_HOST: db
      DB_NAME: notes
      DB_USER: lab
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  db:
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    image: ghcr.io/tommmdl/docker-lab@sha256:8b6813ec76804698c33e4dac8f501ca8f641affcbd27cbc3b7dd6fdb02874fc3
    environment:
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --locale-provider=icu --icu-locale=en-US
      POSTGRES_DB: notes
      POSTGRES_USER: lab
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d notes"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
secrets:
  db_password:
    file: .local/db-password
volumes:
  pgdata:
    name: ${COMPOSE_PROJECT_NAME:-docker-lab}_pgdata_alpine_v1
