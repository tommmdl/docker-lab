# Use with compose.yaml and an isolated project/volume. Never attach Debian PGDATA.
services:
  api:
    image: ${ALTERNATIVE_API_IMAGE:-ghcr.io/tommmdl/docker-lab@sha256:f679d0d3365cdb2580428484d3c0908072629f5f853994ebc50c794f8fac72b5}
  db:
    image: ${POSTGRES_ALTERNATIVE_IMAGE:-ghcr.io/tommmdl/docker-lab@sha256:d99044c05eaac0efa5a3d7bab28ab14a60fe77018cc7c683d6495520ba7bfc4b}
    environment:
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --locale-provider=icu --icu-locale=en-US
